<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Model Librarian</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="">
    <b>Model Librarian</b>
    <span id="dot" class="dot"></span>
  </header>
  <section id="conn" class="conn"></section>
  <section>
    <div class="row">
      <h2>Downloads</h2>
      <span class="spacer"></span>
      <button id="clear" class="small ghost">Clear finished</button>
    </div>
    <div id="queue"></div>
  </section>
  <details id="later" hidden>
    <summary>Saved for later</summary>
    <div id="laterList" class="targets"></div>
  </details>
  <details id="settings">
    <summary>ComfyUI and settings</summary>
    <div class="dim">Which ComfyUI gets the downloads. "Find it" tries ports 8188, 8000 and 8189 on this PC.</div>
    <div id="targets" class="targets"></div>
    <div class="row">
      <input id="base" placeholder="Another address, e.g. http://100.64.0.2:8188" spellcheck="false">
      <button id="save" class="small">Add</button>
    </div>
    <label class="check"><input type="checkbox" id="notify"> Notify me when a download finishes or fails</label>
    <label class="check"><input type="checkbox" id="withNeeds"> Get a model's missing text encoder and VAE with it</label>
  </details>
  <script type="module" src="popup.js"></script>
</body>
</html>
